name: Build and Push Production API Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to publish
        required: true
        default: 1.4.9-role-permissions-v1
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ohoimager/desklink-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.production
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Verify published image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}"
          docker buildx imagetools inspect "${IMAGE_NAME}:latest"
